# E1: single-qubit, constant gamma, sigma_z only

data:
  output_path: data/E1_dataset.npz
  dataset_path: data/E1_dataset.npz

physics:
  system_type: single_qubit
  observables: [sigma_x, sigma_y, sigma_z]  # All Pauli operators for visualization
  gamma_range: [0.1, 2.0]
  omega_range: [0.5, 2.0]
  time_dependent_gamma: false

model:
  type: lstm

training:
  n_epochs: 300  # More epochs for better training

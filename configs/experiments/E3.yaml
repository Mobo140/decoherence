# E3: single-qubit, time-dependent gamma(t), sigma_x,y,z

data:
  output_path: data/E3_dataset.npz
  dataset_path: data/E3_dataset.npz

physics:
  system_type: single_qubit
  observables: [sigma_x, sigma_y, sigma_z]
  gamma_range: [0.1, 2.0]
  omega_range: [0.5, 2.0]
  time_dependent_gamma: true
  bernstein_degree: 3

model:
  type: transformer

training:
  n_epochs: 50

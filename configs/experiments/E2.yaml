# E2: single-qubit, constant gamma, sigma_x,y,z

data:
  output_path: data/E2_dataset.npz
  dataset_path: data/E2_dataset.npz

physics:
  system_type: single_qubit
  observables: [sigma_x, sigma_y, sigma_z]
  gamma_range: [0.1, 2.0]
  omega_range: [0.5, 2.0]
  time_dependent_gamma: false

model:
  type: transformer

training:
  n_epochs: 50

# E5: Early warning system - single qubit, constant gamma, risk prediction
# Focus: Multi-task learning with risk classification

data:
  n_samples: 500  # More samples for early warning
  output_path: data/E5_dataset.npz
  dataset_path: data/E5_dataset.npz
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42

physics:
  system_type: single_qubit
  observables: [sigma_x, sigma_y, sigma_z]
  gamma_range: [0.1, 2.0]
  omega_range: [0.5, 2.0]
  time_dependent_gamma: false
  T_max: 10.0
  dt: 0.1
  decoherence_criterion: coherence
  decoherence_threshold: 0.01
  initial_state_type: random

model:
  type: multitask_transformer
  
  # Encoder config
  d_model: 256
  n_layers: 4
  n_heads: 8
  d_ff: 1024
  dropout_rate: 0.2
  max_seq_len: 500
  use_pos_encoding: true
  pooling: attention
  
  # Task config
  enable_risk: true
  enable_forecast: false
  enable_time: true
  
  # Head config
  n_deltas: 3
  head_hidden_dims: [256, 128, 64]

training:
  # Sliding window config
  window_length: 50
  samples_per_trajectory: 5
  stratified_sampling: true
  
  # Horizons for risk prediction (in time units)
  deltas: [0.5, 1.0, 2.0]
  
  # Training params
  batch_size: 64
  n_epochs: 200
  learning_rate: 0.0001
  optimizer: adamw
  weight_decay: 0.0001
  
  # Loss weights
  lambda_risk: 1.0
  lambda_time: 0.5
  
  # Risk loss config
  use_focal_loss: false
  pos_weight: null  # Will be computed from data
  
  # Learning rate schedule
  lr_schedule: warmup_cosine
  warmup_steps: 1000
  
  # Directories
  checkpoint_dir: checkpoints/E5
  history_dir: runs/E5

evaluation:
  output_dir: figures/E5
  risk_thresholds: [0.3, 0.5, 0.7]
  max_fpr: 0.05  # For TPR@FPR metric
